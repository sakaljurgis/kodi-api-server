<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kodi api test interface</title>
</head>
<body>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalLabel">OK</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="modalBody" class="modal-body">
        ...
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <h2>Welcome</h2>
  <input class="form-check-input" type="checkbox" value="" id="chkDebug">
  <label class="form-check-label" for="chkDebug">
    Debug
  </label>
  <div class="input-group mb-3">
    <label for="endpoint"></label><input type="text" class="form-control" value="/../api" id="endpoint">
    <button class="btn btn-outline-secondary" type="button" id="ok" onClick="okClicked()">OK</button>
  </div>
  <label for="path"></label><input type="text" class="form-control" id="path">
</div>
<div class="container">
  <strong>Category:</strong> <span id="cat"></span>
  <strong>Content:</strong> <span id="cont"></span>
</div>
<div class="container" id="content">
  <div class="list-group" id="list">
    <button type="button" class="list-group-item list-group-item-action" disabled>Nothing here</button>
  </div>
  <div id="video"></div>
</div>
<div id="debug">

</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
<script>

  let paths = [""];

  function okClicked() {
    let path = document.getElementById("endpoint").value;
    paths = [""];
    loadApiPath(path, "replace");
  }

  function loadApiPath(path, historyMode) {
    $.ajax({
      url: path,
      success: function(result) {
        $("#path").val(path);
        if ($("#chkDebug")[0].checked) {
          $("#debug").html("<pre>" + JSON.stringify(result, null, "  ") + "</pre>");
        } else {
          $("#debug").html("");
        }
        // mirror our in-memory navigation into the browser history so the
        // back/forward buttons move between views instead of leaving /if
        if (historyMode === "push") {
          history.pushState({ paths: paths.slice(), url: path }, "");
        } else if (historyMode === "replace") {
          history.replaceState({ paths: paths.slice(), url: path }, "");
        }
        processApiResult(result);
      }
    });
  }

  window.addEventListener("popstate", function(e) {
    if (e.state && e.state.paths) {
      paths = e.state.paths.slice();
      loadApiPath(e.state.url);
    }
  });

  function processApiResult(result) {
    if (!result) return; //todo error

    let endpoint = document.getElementById("endpoint").value;

    // context-menu actions don't refresh the container by default, so the api
    // can return forceUpdate to re-query and re-render the current list
    if (result.forceUpdate) {
      loadApiPath(endpoint + "?path=" + result.forceUpdate.urlParams.path);
      return;
    }

    if (result.msgBoxOK) {
      $("#modalBody").text(result.msgBoxOK);
      $("#modal").modal("show");
    }

    if (result.notification) {
      $("#modalBody").text(result.notification);
      $("#modal").modal("show");
      if (result.refreshContainer === false) {
        paths.pop();
      } else {
        // reload the current container so the action's effect is visible
        loadApiPath(endpoint + "?path=" + paths[paths.length - 1]);
      }
      return;
    }

    if (result.play) {
      //play
      console.log("play, got from api " + result.play);
      genPlayer(result.play);
      $("#path").val(result.play);
      return;
    }

    if (result.updateList) {
      updateList(result);
      return;
    }

    if (result.updateList === false || result.refreshContainer === false) {
      paths.pop();
    }

    if (result.content) {
      $("#cont").text(result.content);
    }

    if (result.category) {
      $("#cat").text(result.category);
    }

  }

  function updateList(result) {
    let contentElement = $("#cont");

    contentElement.text("");
    if (result.content) {
      contentElement.text(result.content);
    }

    let titleElement = $("#cat");
    titleElement.text("");
    if (result.category) {
      titleElement.text(result.category);
    }

    if (result.items) {

      if (!result.nosort) {
        result.items.sort(function(a, b) {
          let lbA = a.label;
          let lbB = b.label;

          let the1 = new RegExp("(the.)", "gi");
          let the2 = new RegExp("(the)", "gi");
          lbA = lbA.replace(the1, "");
          lbA = lbA.replace(the2, "");
          lbB = lbB.replace(the1, "");
          lbB = lbB.replace(the2, "");

          return lbA > lbB ? 1 : -1;
        });
      }

      let itemsHtml = "<div class=\"list-group\" id=\"list\">";
      let itemIcon = "";
      if (paths.length > 1) {

        let itemHtml = "<button type=\"button\" class=\"list-group-item list-group-item-action\"";
        itemHtml = itemHtml + " data-path=\"..\"";
        itemHtml = itemHtml + " data-folder=\"true\"";
        itemHtml = itemHtml + ">";

        itemIcon = "<i class=\"bi-folder\"></i>";

        itemHtml = itemHtml + itemIcon + " ..</button>";
        itemsHtml = itemsHtml + itemHtml;

      }

      for (let i = 0; i < result.items.length; i++) {
        let item = result.items[i];
        let hasContextMenus = item.contextMenus && item.contextMenus.length;

        // context-menu items live inside a flex row, so the action area is a plain
        // button and the row wrapper carries the list-group-item styling
        let btnClass = hasContextMenus
          ? "btn text-start flex-grow-1 border-0 py-2 px-3"
          : "list-group-item list-group-item-action";

        let itemHtml = "<button type=\"button\" class=\"" + btnClass + "\"";
        itemHtml = itemHtml + " data-path=\"" + item.path + "\"";
        if (item.searchFor) {
          itemHtml = itemHtml + " data-searchfor=\"" + item.searchFor + "\"";
        }
        itemHtml = itemHtml + " data-playable=\"" + (item.IsPlayable || item.mediatype === "video") + "\"";
        itemHtml = itemHtml + " data-folder=\"" + (item.isFolder) + "\"";

        itemIcon = item.isFolder ? "<i class=\"bi-folder\"></i>" : "<i class=\"bi-film\"></i>";
        if (item.action) {
          if (!item.IsPlayable) {
            itemIcon = item.action === "search" ? "<i class=\"bi-search\"></i>" : "<i class=\"bi-gear\"></i>";
          }
          itemHtml = itemHtml + " data-action=\"" + item.action + "\"";
        }

        itemHtml = itemHtml + ">";

        itemHtml = itemHtml + itemIcon + " " + item.label + (item.plot ? "<div class=\"fw-lighter\">" + item.plot + "</div>" : "") + "</button>";

        if (hasContextMenus) {
          let menuHtml = "<div class=\"dropdown me-2\">";
          menuHtml = menuHtml + "<button type=\"button\" class=\"btn btn-sm btn-outline-secondary\" data-bs-toggle=\"dropdown\" aria-expanded=\"false\"><i class=\"bi-three-dots-vertical\"></i></button>";
          menuHtml = menuHtml + "<ul class=\"dropdown-menu dropdown-menu-end\">";
          for (let j = 0; j < item.contextMenus.length; j++) {
            let cm = item.contextMenus[j];
            let cmPath = cm.urlParams ? cm.urlParams.path : cm.path;
            menuHtml = menuHtml + "<li><button type=\"button\" class=\"dropdown-item\" data-cm-path=\"" + cmPath + "\">" + cm.name + "</button></li>";
          }
          menuHtml = menuHtml + "</ul></div>";

          itemHtml = "<div class=\"list-group-item d-flex justify-content-between align-items-center p-0\">" + itemHtml + menuHtml + "</div>";
        }

        itemsHtml = itemsHtml + itemHtml;
      }
      itemsHtml = itemsHtml + "</div>";
      $("#content").html(itemsHtml);
    }

  }

  $(document).click(function(e) {
    //todo - disable navigation after click

    let endpoint = document.getElementById("endpoint").value;

    // a context-menu option was selected -> query its path, same as action "query"
    let cmEl = $(e.target).closest("[data-cm-path]");
    if (cmEl.length) {
      loadApiPath(endpoint + "?path=" + cmEl.attr("data-cm-path"));
      return;
    }

    // resolve the clicked item from the closest element holding item data,
    // so clicks on the inner icon/plot still navigate
    let itemEl = $(e.target).closest("[data-path]");
    if (!itemEl.length) {
      return;
    }

    let path = itemEl.data("path");
    let folder = itemEl.data("folder");
    let playable = itemEl.data("playable");
    let action = itemEl.data("action");
    let searchFor = itemEl.data("searchfor");

    if (folder && path) {
      //navigate?
      if (path === "..") {
        // go up a level via history so browser-back and in-page back stay in
        // sync; popstate restores the parent's paths snapshot and reloads it
        history.back();
        return;
      }

      if (path === ".") {
        // refresh the current container (e.g. player "Back"), no history change
        loadApiPath(endpoint + "?path=" + paths[paths.length - 1]);
        return;
      }

      paths.push(path);
      loadApiPath(endpoint + "?path=" + path, "push");
      return;
    }

    if (playable && path) {
      if (action && action === "query") {
        //get path from api
        console.log("play, get path from api " + path);
        loadApiPath(endpoint + "?path=" + path);
        return;
      }
      //if http included - play directly, if not - play from server
      console.log("play " + path);
      genPlayer(path);
      return;
    }

    if (action && action === "search") {
      let iSearchFor = searchFor ? searchFor : "";
      let searchText = prompt("What are you searching for?", iSearchFor);
      if (searchText) {
        paths.push(path + "&search=" + searchText);
        loadApiPath(endpoint + "?path=" + path + "&search=" + searchText, "push");
      }
    }

  });
let videoPlayer;

    itemHtml = itemHtml + " data-folder=\"true\"";
    itemHtml = itemHtml + ">";

    let itemIcon = "<i class=\"bi-folder\"></i>";

    itemHtml = itemHtml + itemIcon + " Back</button>";
    itemsHtml = itemsHtml + itemHtml;
    itemsHtml = itemsHtml + "</div>";

    $("#path").val(window.location.origin + urlPath);

    let contentElement = $("#content");

    // if (type) {

    //   return;

     contentElement.html(itemsHtml + "<video width=\"100%\" controls><source src=\"" + urlPath + "\"></video>");



    // $.ajax(urlPath, {
    //   method: 'HEAD',
    //   success: (a, b, c) => {
    //     let contentType = c.getResponseHeader('content-type')
    //     if (contentType) {
    //       let videoElementHtml = "<video width=\"100%\" controls><source src=\"" + urlPath + "\" type=\"" + contentType + "\"></video>";
    //         contentElement.html(itemsHtml + videoElementHtml);

    //       contentElement.html(itemsHtml + "<video width=\"100%\" controls><source src=\"" + urlPath + "\"></video>");

</script>
</body>
